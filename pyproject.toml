[project]
name = "gclub-pixel"
version = "0.1.0"
description = "LLM-friendly pixel art generation toolkit. Write code, get game-ready sprites and animations."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "G Club Contributors" }]
keywords = ["pixel-art", "gamedev", "sprite", "animation", "llm", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Games/Entertainment",
    "Topic :: Multimedia :: Graphics",
]

dependencies = [
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
gemini = [
    "google-genai>=1.0",
]

[project.scripts]
gclub-pixel = "gclub_pixel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gclub_pixel"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
